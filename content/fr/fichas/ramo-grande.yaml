      url: https://tradicional.dgadr.gov.pt/images/prod_imagens/carne/docs/CE_Ramo_Grande_DOP.pdf
  - title: Classification des carcasses
    paras:
    - Chez le novilho, le taureau et le castré, les classes de conformation S, E, U, R et O sont acceptées ; pour les autres catégories, la classe P l’est aussi, compte tenu de la morphologie et du mode d’élevage de la race. Les carcasses dont la couverture de gras est de classe 1 ne sont pas admises.
    sources:
    - label: Cahier des charges (DGADR)
      url: https://tradicional.dgadr.gov.pt/images/prod_imagens/carne/docs/CE_Ramo_Grande_DOP.pdf
  - title: Découpe et présentation
    paras:
    - Le désossage ne peut se faire que 48 à 144 heures après l’abattage, afin de garantir le refroidissement nécessaire. La viande peut être présentée en carcasses, demi-carcasses, quartiers, pièces entières ou tranchées et viande hachée emballée, toujours avec la mention « CARNE RAMO GRANDE – DENOMINAÇÃO DE ORIGEM PROTEGIDA » ou « CARNE RAMO GRANDE DOP ».
    sources:
    - label: Cahier des charges (DGADR)
      url: https://tradicional.dgadr.gov.pt/images/prod_imagens/carne/docs/CE_Ramo_Grande_DOP.pdf
  - title: Morceaux, maturation et gastronomie
    paras:
    - 'En cours de recherche : les sources lues ne décrivent ni morceaux, ni maturation, ni recettes concrètes. La DGADR mentionne seulement les plats des « funções » du Saint-Esprit.'
    status: en cours de recherche
- id: certificacao
  title: Certification
  summary: 'Carne Ramo Grande est une AOP : elle lie le produit à la race et aux Açores.'
  blocks:
  - title: Ce qu’est une AOP
    paras:
    - 'L’appellation d’origine protégée est le régime européen au lien le plus fort avec le lieu : selon la Commission européenne, toutes les étapes de production, de transformation et de préparation doivent avoir lieu dans la région. Pour l’IGP, une seule des étapes suffit.'
    sources:
    - label: Commission européenne — Geographical indications and quality schemes explained
      url: https://agriculture.ec.europa.eu/farming/geographical-indications-and-quality-schemes/geographical-indications-and-quality-schemes-explained_en
  - title: Exigences
    list:
    - Animaux de race Ramo Grande, inscrits au livre généalogique.
    - Nés, élevés et abattus aux Açores.
    - Alimentation fondée sur le pâturage ; aliments venus de l’extérieur des Açores jusqu’à 50 % de la matière sèche annuelle.
    - Catégories d’âge et poids minimaux de carcasse définis dans le cahier des charges.
    sources:
    - label: Cahier des charges (DGADR)
      url: https://tradicional.dgadr.gov.pt/images/prod_imagens/carne/docs/CE_Ramo_Grande_DOP.pdf
  - title: Aire géographique
    paras:
    - Les neuf îles des Açores.
    sources:
    - label: Carne Ramo Grande DOP (DGADR)
      url: https://tradicional.dgadr.gov.pt/pt/cat/carne/carne-de-bovino/1080-carne-ramo-grande-dop
  - title: Cahier des charges
    paras:
    - Le document officiel décrit le produit, l’aire, la preuve d’origine, le mode de production, l’abattage, l’étiquetage et le lien avec le milieu. Il le classe dans la classe 1.1 (viande fraîche et abats), selon l’annexe XI du règlement d’exécution (UE) n° 668/2014. La version et la date du cahier des charges lui-même ne figurent pas dans le document que nous avons lu.
    sources:
    - label: Cahier des charges Carne Ramo Grande DOP (PDF, DGADR)
      url: https://tradicional.dgadr.gov.pt/images/prod_imagens/carne/docs/CE_Ramo_Grande_DOP.pdf
  - title: Organismes responsables
    list:
    - 'Groupement de producteurs : Associação de Criadores de Bovinos da Raça Ramo Grande.'
    - 'Contrôle et certification : IAMA, IPR (Instituto de Alimentação e Mercados Agrícolas), selon la DGADR. Le cahier des charges évoque un organisme auquel l’autorité compétente délègue ces fonctions, sans le nommer.'
    sources:
    - label: Carne Ramo Grande DOP (DGADR)
      url: https://tradicional.dgadr.gov.pt/pt/cat/carne/carne-de-bovino/1080-carne-ramo-grande-dop
  - title: Contrôle et traçabilité
    paras:
    - Les producteurs s’engagent par écrit auprès du groupement gestionnaire à respecter le cahier des charges et à placer toute l’exploitation sous contrôle. L’inscription au livre généalogique et l’abattage dans des abattoirs de l’aire permettent de retracer l’origine.
    sources:
    - label: Cahier des charges (DGADR)
      url: https://tradicional.dgadr.gov.pt/images/prod_imagens/carne/docs/CE_Ramo_Grande_DOP.pdf
  - title: Enregistrement européen
    paras:
    - La dénomination figure au registre européen eAmbrosia sous le numéro EUGI00000017632.
    sources:
    - label: eAmbrosia — EUGI00000017632
      url: https://ec.europa.eu/agriculture/eambrosia/geographical-indications-register/details/EUGI00000017632
    - label: GI View — EUGI00000017632
      url: https://www.tmdn.org/giview/gi/EUGI00000017632
- id: onde
  title: Où la trouver
  summary: En cours de recherche.
  blocks:
  - title: Points de vente
    paras:
    - 'En cours de recherche : la page de la DGADR ne liste pas de points de vente et ne vend rien. Les boucheries, l’abattoir et la commercialisation entre les îles et vers le continent ne seront publiés qu’avec une source.'
    status: en cours de recherche
- id: curiosidades
  title: Curiosités
  summary: Un nom de lieu, un bœuf de travail et une fête.
  blocks:
  - title: Du lieu au nom
    paras:
    - Ramo Grande est le nom d’une zone de l’île de Terceira et a donné son nom à la race.
    sources:
    - label: Cahier des charges (DGADR)
      url: https://tradicional.dgadr.gov.pt/images/prod_imagens/carne/docs/CE_Ramo_Grande_DOP.pdf
  - title: Deux rouges
    paras:
    - À Terceira domine le rouge fauve et à São Jorge le rouge cerise.
    sources:
    - label: Catalogue officiel (DGAV/CAP), p. 62
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
