intro: Le bétail « charnequeiro » du Sul do Tejo, aujourd’hui élevé pour la viande.
facts:
- label: Berceau
  value: Sul do Tejo
- label: Effectif
  value: 1 844
  note: '2019'
sections:
- id: historia
  title: Histoire
  summary: Origine et parcours de la race, d’après le catalogue officiel.
  blocks:
  - title: L’histoire
    paras:
    - À partir du milieu du XIXe siècle, on recense des bovins noirs sous des noms comme « Gado Charnequeiro do Sul do Tejo » et « Gado da Terra ». C’étaient surtout des animaux de trait, appréciés pour leur force, pour leur tolérance à une alimentation pauvre et à un climat extrême, et pour leur fumier, qui fertilisait la terre ; la viande comptait peu. Avec la modernisation agricole, ils ont perdu leur fonction, et dans les années 80 l’arrivée de races exotiques a encore réduit l’effectif, au point que la race a été considérée en voie d’extinction. Elle a survécu grâce à des éleveurs qui ont conservé des noyaux de femelles pures pour produire des croisés.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 58
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: État du texte
    paras:
    - Texte original du projet, réécrit à partir du Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 58. Aucun paragraphe n’est une copie du catalogue. Les faits ont été confrontés au catalogue ; la relecture indépendante (ChatGPT/spécialiste) est en attente. Tous les chiffres et statuts de conservation sont ceux du catalogue de 2019, et non des effectifs actuels ; des données officielles plus récentes restent à trouver.
- id: caracteristicas
  title: Caractéristiques
  summary: Comment reconnaître l’animal.
  blocks:
  - title: Comment la reconnaître
    paras:
    - 'Robe tendant vers le noir uniforme, parfois brune ou tigrée. C’est un animal de grande corpulence : vaches de 400 à 600 kg et taureaux de 700 à 1000 kg. Les cornes sont en crochet haut. Les mâles ont un gros morrillo.'
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 58
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territoire
  summary: Le berceau de la race et l’effectif enregistré.
  blocks:
  - title: Berceau
    paras:
    - Sul do Tejo — l’ancien « Gado Charnequeiro do Sul do Tejo ».
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 58
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Effectif enregistré (2019)
    paras:
    - 1 774 femelles, 70 mâles et 30 éleveurs, selon le catalogue officiel (2019). Ce ne sont pas des effectifs actuels.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 58
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Élevage
  summary: Comment et où on l’élève.
  blocks:
  - title: Comment on l’élève
    paras:
    - Aujourd’hui, l’objectif est presque uniquement la viande, en régime extensif. L’alimentation repose sur des pâturages naturels, en général sous couvert de montado, des chaumes, du gland et des produits d’éclaircie du montado. Les éleveurs citent l’adaptation aux zones défavorisées comme principal avantage.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 58
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: carne
  title: Viande
  summary: La viande de cette race.
  blocks:
  - title: La viande
    paras:
    - La description de la viande de cette race (couleur, gras, maturation, morceaux) n’a pas encore été confirmée par une source. Nous ne la publions pas tant qu’il n’y a pas de référence.
    status: en cours de recherche
- id: certificacao
  title: Certification
  summary: Certification et reconnaissances.
  blocks:
