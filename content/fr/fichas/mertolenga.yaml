intro: Le bœuf de licol devenu race.
facts:
- label: Berceau
  value: Baixo Alentejo
- label: Effectif
  value: 8 565
  note: '2019'
sections:
- id: historia
  title: Histoire
  summary: Origine et parcours de la race, d’après le catalogue officiel.
  blocks:
  - title: L’histoire
    paras:
    - 'La Mertolenga naît du Baixo Alentejo, dans les terres de Mértola, d’Alcoutim et de Martim Longo. On l’appelait le « bœuf de licol » (« boi de cabresto ») : le placide qui accompagnait le bétail de combat au Ribatejo. Vers 1900, avec l’ouverture de la frontière au bétail des deux pays ibériques, des bovins tachetés d’Espagne arrivèrent, réputés rustiques. Dans les premières décennies du XXe siècle, les zones rizicoles du Tejo, du Sado et du Sorraia avaient besoin d’un animal énergique, que les autres races ne satisfaisaient pas, et le type rouge bragado, lié à Coruche, apparut. Le mélange de plusieurs lignées, avec un type rouan (« mil-flores »), consolida la race, et la Herdade da Abóboda servit de lieu de standardisation.'
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 46
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: État du texte
    paras:
    - Texte original du projet, réécrit à partir du Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 46. Aucun paragraphe n’est une copie du catalogue. Les faits ont été confrontés au catalogue ; la relecture indépendante (ChatGPT/spécialiste) est en attente. Tous les chiffres et statuts de conservation sont ceux du catalogue de 2019, et non des effectifs actuels ; des données officielles plus récentes restent à trouver.
- id: caracteristicas
  title: Caractéristiques
  summary: Comment reconnaître l’animal.
  blocks:
  - title: Comment la reconnaître
    paras:
    - La robe peut être rouge, rouan, rouge tacheté ou tacheté de rouge. Les cornes sont fines, blanches, à pointe sombre, en crochet ou en lyre basse. C’est un animal de taille moyenne, à l’ossature fine, de tempérament nerveux.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 46
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territoire
  summary: Le berceau de la race et l’effectif enregistré.
  blocks:
  - title: Berceau
    paras:
    - Baixo Alentejo — terres de Mértola, d’Alcoutim et de Martinlongo.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 46
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Effectif enregistré (2019)
    paras:
    - 8 358 femelles, 207 mâles et 216 éleveurs, selon le catalogue officiel (2019). Ce ne sont pas des effectifs actuels.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 46
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Élevage
  summary: Comment et où on l’élève.
  blocks:
  - title: Comment on l’élève
    paras:
    - Le catalogue met en avant la rusticité, la facilité de vêlage, la longévité productive et la bonne aptitude maternelle, ce qui en fait une bonne mère pour les lignées maternelles.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 46
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: carne
  title: Viande
  summary: La viande de cette race.
  blocks:
  - title: La viande
    paras:
