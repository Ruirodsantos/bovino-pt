intro: La seule race sélectionnée sur son comportement.
facts:
- label: Berceau
  value: Ribatejo e Oeste
- label: Effectif
  value: 6 413
  note: '2019'
sections:
- id: historia
  title: Histoire
  summary: Origine et parcours de la race, selon le catalogue officiel.
  blocks:
  - title: L’histoire
    paras:
    - 'La Brava de Lide est différente de toutes les autres races autochtones : elle a été sélectionnée non pour son corps, mais pour son caractère. Le catalogue associe son origine à l’aurochs, le bovin sauvage qui a survécu en Europe jusqu’au XVIIe siècle ; il s’agit d’une thèse sur l’origine, et non d’une filiation directe démontrée dans ce texte. Au Portugal, les animaux les plus agressifs apparus parmi les bovins locaux ont fini par donner naissance à une lignée propre, cultivée pour sa bravoure, et la lide est devenue la raison d’être de la race.'
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 22
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Aujourd’hui
    paras:
    - Les régions d’élevage sont l’Alentejo, le Ribatejo e Oeste, la Beira Interior et la Beira Litoral, ainsi que les Açores. Cette race a une fonction culturelle et écologique propre ; le projet ne traite pas sa viande.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 22
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: État du texte
    paras:
    - Texte original du projet, réécrit à partir du Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 22. Aucun paragraphe n’est une copie du catalogue. Les faits ont été vérifiés avec le catalogue ; la relecture indépendante (ChatGPT/spécialiste) est en attente. Tous les chiffres et statuts de conservation sont ceux du catalogue de 2019, et non des effectifs actuels ; des données officielles plus récentes restent à rechercher.
- id: caracteristicas
  title: Caractéristiques
  summary: Comment reconnaître l’animal.
  blocks:
  - title: Comment la reconnaître
    paras:
    - Elle a un squelette fin, une peau fine, un tronc bien musclé, peu de fanon et des cornes fines, en forme de crochet. Les robes sont très variées et font partie du vocabulaire de l’élevage. Les poids moyens indiqués dans le catalogue sont d’environ 500 kg chez les mâles et 280 kg chez les femelles.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 22
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territoire
  summary: Le berceau de la race et l’effectif enregistré.
  blocks:
  - title: Berceau
    paras:
    - Ribatejo e Oeste, Alentejo, Beiras et Açores.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 22
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Effectif enregistré (2019)
    paras:
    - 5 938 femelles, 475 mâles et 97 éleveurs, selon le catalogue officiel (2019). Ce ne sont pas des effectifs actuels.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 22
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Élevage
  summary: Comment et où elle est élevée.
  blocks:
  - title: Comment elle est élevée
    paras:
    - Elle vit dans de vastes exploitations, dans des plaines et des vallées pourvues d’eau et de pâturage. L’élevage se fait par lignées de sang, les « encastes », et la sélection repose sur des épreuves de comportement.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 22
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: carne
  title: Viande
  summary: La viande de cette race.
  blocks:
  - title: La viande
    paras:
    - La description de la viande de cette race (couleur, gras, maturation, morceaux) n’a pas encore été confirmée par une source. Nous ne la publions pas tant qu’il n’y a pas de référence.
    status: en cours d'investigation
- id: certificacao
  title: Certification
  summary: Certification et reconnaissances.
  blocks:
  - title: Certification
    paras:
    - 'Statut d’AOP/IGP et autres reconnaissances de cette race : à confirmer dans la liste officielle de la DGADR et dans eAmbrosia.'
    status: en cours d'investigation
- id: onde
  title: Où en trouver
  summary: Où en trouver.
  blocks:
  - title: Où en trouver
    paras:
    - 'Points de vente, producteurs et association d’éleveurs : à rechercher. Nous n’indiquons ni points de vente ni prix que nous n’aurions pas vérifiés.'
    status: en cours d'investigation
