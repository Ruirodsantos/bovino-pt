intro: Une race de labour, de l’estuaire du Vouga.
facts:
- label: Berceau
  value: Terres de l’estuaire du Vouga
- label: Effectif
  value: '975'
  note: '2019'
sections:
- id: historia
  title: Histoire
  summary: Origine et parcours de la race, d’après le catalogue officiel.
  blocks:
  - title: L’histoire
    paras:
    - La Marinhoa est liée aux « marinhas » de la Beira Litoral, les terres basses et fertiles de l’estuaire du Vouga, du Cértima et de l’Antuã. C’était un animal puissant, haut sur pattes, idéal pour la culture du riz, pour la récolte du moliço dans la ria et pour l’Arte Xávega. Elle était présente dans presque toutes les maisons et a aidé à fixer les populations dans les villages d’une région de petites parcelles. La mécanisation a réduit le travail des animaux, et le bassin laitier qui s’est développé dans la région a remplacé de nombreuses Marinhoas par des vaches laitières. Elle a survécu parce que beaucoup de familles ont gardé quelques exemplaires comme complément économique.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 38
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Aujourd’hui
    paras:
    - On exploite surtout l’aptitude à la viande ; le travail est résiduel.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 38
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: État du texte
    paras:
    - Texte original du projet, réécrit à partir du Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 38. Aucun paragraphe n’est une copie du catalogue. Les faits ont été confrontés au catalogue ; la relecture indépendante (ChatGPT/spécialiste) est en attente. Tous les chiffres et statuts de conservation sont ceux du catalogue de 2019, et non des effectifs actuels ; des données officielles plus récentes restent à trouver.
- id: caracteristicas
  title: Caractéristiques
  summary: Comment reconnaître l’animal.
  blocks:
  - title: Comment la reconnaître
    paras:
    - 'C’est un animal de grand gabarit : environ 135 cm de hauteur au garrot, et 600 à 700 kg chez les femelles adultes, 900 à 1000 kg chez les mâles. La robe est jaune, dans des tons de paille, parfois tirant davantage sur le cerise, avec des poils plus foncés sur le bord des oreilles, au fanon, autour des yeux et au bout de la queue. Elle est docile et facile à manier.'
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 38
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territoire
  summary: Le berceau de la race et l’effectif enregistré.
  blocks:
  - title: Berceau
    paras:
    - Terres de l’estuaire du Vouga, du Cértima et de l’Antuã (Baixo Vouga).
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 38
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Effectif enregistré (2019)
    paras:
    - 884 femelles, 91 mâles et 280 éleveurs, selon le catalogue officiel (2019). Ce ne sont pas des effectifs actuels.
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 38
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Élevage
  summary: Comment et où on l’élève.
  blocks:
  - title: Comment on l’élève
    paras:
    - 'Le système le plus traditionnel est l’élevage intensif en plein air : pâturage quelques mois par an et retour quotidien à l’étable. L’alimentation repose sur des pâturages naturels ou semés, complétés par des céréales, des pailles et des légumineuses.'
    sources:
    - label: Catalogue officiel des races autochtones portugaises (DGAV/CAP, 2019), p. 38
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: carne
  title: Viande
  summary: La viande de cette race.
  blocks:
  - title: La viande
    paras:
    - La description de la viande de cette race (couleur, gras, maturation, morceaux) n’a pas encore été confirmée par une source. Nous ne la publions pas tant qu’il n’y a pas de référence.
    status: en cours de recherche
- id: certificacao
  title: Certification
  summary: Certification et reconnaissances.
  blocks:
