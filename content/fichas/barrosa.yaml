intro: A raça de grandes cornos em lira, do planalto do Barroso.
facts:
- label: Solar
  value: Zonas planálticas do Barroso
- label: Efetivo
  value: 7 130
  note: '2019'
sections:
- id: historia
  title: História
  summary: Origem e percurso da raça, segundo o catálogo oficial.
  blocks:
  - title: A história
    paras:
    - A Barrosã tem uma origem muito discutida. Uma das hipóteses que o catálogo refere liga-a a bovinos do norte de África, de cornos grandes e espessos, que teriam chegado à Península Ibérica em época de presença moura. Mais tarde teria sido empurrada por outros grupos de bovinos para as terras altas do Barroso, onde ficou. Seja qual for a origem, é uma raça de morfologia muito própria, difícil de encaixar nas restantes raças ibéricas.
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 18
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Hoje
    paras:
    - O catálogo indica que a Barrosã é cada vez mais explorada para carne, e refere a Denominação de Origem Protegida «Carne Barrosã». O registo exato da denominação será confirmado na base europeia eAmbrosia antes de ser mostrado como dado verificado.
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 18
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Estado do texto
    paras:
    - Texto original do projeto, reescrito a partir do Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 18. Nenhum parágrafo é cópia do catálogo. Os factos foram conferidos com o catálogo; a revisão independente (ChatGPT/especialista) está pendente. Todos os números e estados de conservação são os do catálogo de 2019, não efetivos atuais; dados oficiais mais recentes por procurar.
- id: caracteristicas
  title: Características
  summary: Como se reconhece o animal.
  blocks:
  - title: Como se reconhece
    paras:
    - Os cornos, grossos e compridos, em lira alta, são o que primeiro se vê. O pelo é castanho-claro, entre o palha e o acerejado, e a pele é grossa mas macia, com pregas no pescoço. A barbela é muito desenvolvida. É uma raça dócil, com forte instinto maternal.
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 18
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Território
  summary: O solar da raça e o efetivo registado.
  blocks:
  - title: Solar
    paras:
    - Zonas planálticas do Barroso.
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 18
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Efetivo registado (2019)
    paras:
    - 6 775 fêmeas, 355 machos e 1 926 criadores, segundo o catálogo oficial (2019). Não são efetivos atuais.
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 18
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Criação
  summary: Como e onde se cria.
  blocks:
  - title: Como se cria
    paras:
    - 'É criada em sistema extensivo, em montanha e meia encosta, aproveitando recursos como a carqueja e o tojo. O catálogo sublinha o seu papel para a paisagem rural: trabalhava pequenas parcelas e socalcos, e fornecia estrume para solos pobres.'
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 18
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: carne
  title: Carne
  summary: A carne desta raça.
  blocks:
  - title: A carne
    paras:
    - A descrição da carne desta raça (cor, gordura, maturação, cortes) ainda não foi confirmada em fonte. Não a publicamos até haver referência.
    status: em investigação
- id: certificacao
  title: Certificação
  summary: Certificação e reconhecimentos.
  blocks:
  - title: Certificação
    paras:
    - 'Estado de DOP/IGP e outros reconhecimentos desta raça: por confirmar na lista oficial da DGADR e no eAmbrosia.'
    status: em investigação
- id: onde
  title: Onde encontrar
  summary: Onde encontrar.
  blocks:
  - title: Onde encontrar
    paras:
    - 'Pontos de venda, produtores e associação de criadores: por pesquisar. Não indicamos pontos de venda nem preços que não tenhamos verificado.'
    status: em investigação
