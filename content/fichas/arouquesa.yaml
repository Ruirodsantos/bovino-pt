intro: A raça das encostas entre o Vouga e o Douro.
facts:
- label: Solar
  value: Encostas montanhosas entre os vales do Vouga e do Douro
- label: Efetivo
  value: 3 814
  note: '2019'
sections:
- id: historia
  title: História
  summary: Origem e percurso da raça, segundo o catálogo oficial.
  blocks:
  - title: A história
    paras:
    - 'A Arouquesa é uma raça de montanha. Nunca saiu muito do território onde nasceu: as encostas entre o vale do Vouga e o Douro. O nome pode vir do auroque, o antepassado selvagem dos bovinos, hoje extinto, ou da vila de Arouca; os autores divergem. No passado reconheciam-se variedades locais, com nomes como Sulanos (S. Pedro do Sul), Paivotos (rio Paiva), Caramuleiros (serra do Caramulo) e Canaveses (Marco de Canaveses e Baião).'
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 14
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Hoje
    paras:
    - Os concelhos com mais animais são Cinfães, Castro Daire, S. Pedro do Sul, Arouca, Vale de Cambra, Resende e Castelo de Paiva, a sul do Douro, e Baião, Amarante e Marco de Canaveses, a norte.
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 14
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Estado do texto
    paras:
    - Texto original do projeto, reescrito a partir do Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 14. Nenhum parágrafo é cópia do catálogo. Os factos foram conferidos com o catálogo; a revisão independente (ChatGPT/especialista) está pendente. Todos os números e estados de conservação são os do catálogo de 2019, não efetivos atuais; dados oficiais mais recentes por procurar.
- id: caracteristicas
  title: Características
  summary: Como se reconhece o animal.
  blocks:
  - title: Como se reconhece
    paras:
    - É uma raça de porte pequeno a médio, de formas arredondadas e expressão dócil mas viva. O pelo é castanho, do tom palha ao acerejado, mais escuro à volta dos olhos e das orelhas. Os cornos têm forma de lira baixa, claros na maior parte do comprimento e com as pontas escuras.
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 14
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Território
  summary: O solar da raça e o efetivo registado.
  blocks:
  - title: Solar
    paras:
    - Encostas montanhosas entre os vales do Vouga e do Douro (Arouca, Cinfães, Castro Daire…).
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 14
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Efetivo registado (2019)
    paras:
    - 3 680 fêmeas, 134 machos e 3 315 criadores, segundo o catálogo oficial (2019). Não são efetivos atuais.
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 14
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Criação
  summary: Como e onde se cria.
  blocks:
  - title: Como se cria
    paras:
    - 'Vive de pastos pobres da serra e de rebentos de tojo, carqueja, giesta e carvalho. Os sistemas variam: pastoreio em baldios (raro hoje), estabulação permanente, estabulação só no inverno ou um regime semi-extensivo em que os animais apenas dormem no estábulo. O catálogo destaca três aptidões: a carne, o trabalho e o leite.'
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 14
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: carne
  title: Carne
  summary: A carne desta raça.
  blocks:
  - title: A carne
    paras:
    - A descrição da carne desta raça (cor, gordura, maturação, cortes) ainda não foi confirmada em fonte. Não a publicamos até haver referência.
    status: em investigação
- id: certificacao
  title: Certificação
  summary: Certificação e reconhecimentos.
  blocks:
  - title: Certificação
    paras:
    - 'Estado de DOP/IGP e outros reconhecimentos desta raça: por confirmar na lista oficial da DGADR e no eAmbrosia.'
    status: em investigação
- id: onde
  title: Onde encontrar
  summary: Onde encontrar.
  blocks:
  - title: Onde encontrar
    paras:
    - 'Pontos de venda, produtores e associação de criadores: por pesquisar. Não indicamos pontos de venda nem preços que não tenhamos verificado.'
    status: em investigação
