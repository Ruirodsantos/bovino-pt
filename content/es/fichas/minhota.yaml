intro: 'La única raza portuguesa de triple aptitud: carne, leche y trabajo.'
facts:
- label: Solar
  value: Entre Douro e Minho
- label: Efectivo
  value: 6 076
  note: '2019'
sections:
- id: historia
  title: Historia
  summary: Origen y trayectoria de la raza, según el catálogo oficial.
  blocks:
  - title: La historia
    paras:
    - Durante mucho tiempo se llamó Minhota o Galega. Al comienzo del registro zootécnico se adoptó el nombre Galega, que duró hasta 2002 y aún es corriente entre los criadores. Para distinguirla de la Rubia Gallega, la española, el nombre oficial pasó a ser Minhota. El libro genealógico arrancó en 1997, y a partir de 2001 se empezó a producir semen de toros minhotos; en 2002 se reconoció el peligro de extinción y se abrió la candidatura de los criadores a las medidas agroambientales.
    sources:
    - label: Catálogo Oficial de Razas Autóctonas Portuguesas (DGAV/CAP, 2019), p. 50
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Estado del texto
    paras:
    - Texto original del proyecto, reescrito a partir del Catálogo Oficial de Razas Autóctonas Portuguesas (DGAV/CAP, 2019), p. 50. Ningún párrafo es copia del catálogo. Los hechos se contrastaron con el catálogo; la revisión independiente (ChatGPT/especialista) está pendiente. Todas las cifras y estados de conservación son los del catálogo de 2019, no efectivos actuales; datos oficiales más recientes por buscar.
- id: caracteristicas
  title: Características
  summary: Cómo se reconoce al animal.
  blocks:
  - title: Cómo se reconoce
    paras:
    - El pelaje es flavo, del rojo claro al paja. Los cuernos, de tamaño medio, salen casi en horizontal y se doblan hacia atrás y después hacia delante. Es una raza de corpulencia media a grande, de silueta rectangular.
    sources:
    - label: Catálogo Oficial de Razas Autóctonas Portuguesas (DGAV/CAP, 2019), p. 50
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territorio
  summary: El solar de la raza y el efectivo registrado.
  blocks:
  - title: Solar
    paras:
    - Entre Douro e Minho.
    sources:
    - label: Catálogo Oficial de Razas Autóctonas Portuguesas (DGAV/CAP, 2019), p. 50
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Efectivo registrado (2019)
    paras:
    - 5 912 hembras, 164 machos y 1 721 criadores, según el catálogo oficial (2019). No son efectivos actuales.
    sources:
    - label: Catálogo Oficial de Razas Autóctonas Portuguesas (DGAV/CAP, 2019), p. 50
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: carne
  title: Carne
  summary: La carne de esta raza.
  blocks:
  - title: La carne
    paras:
    - 'Aquí el catálogo es más concreto que para otras razas. El principal producto es la ternera, vendida en promedio a los 6,2 ± 1,15 meses; el 52,5 % de los sacrificios de animales Minhotos dan canales de categoría V (animales con menos de 8 meses), con un peso medio de canal de 149,6 ± 31,41 kg. La producción de machos castrados, con gran tradición en algunas regiones, tiende a recuperarse: los animales se castran entre los 6 y los 8 meses, alcanzan gran desarrollo y se sacrifican normalmente después de los tres años. La canal tiene excelente conformación y la carne es de elevada terneza. El catálogo señala la exportación a España, que absorbe gran parte de la producción, como uno de los motivos de la recuperación de los castrados. Estos valores son del catálogo (2019 o anterior).'
    sources:
    - label: Catálogo Oficial de Razas Autóctonas Portuguesas (DGAV/CAP, 2019), p. 50
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: certificacao
  title: Certificación
  summary: Certificación y reconocimientos.
  blocks:
  - title: Certificación
    paras:
    - 'Estado de DOP/IGP y otros reconocimientos de esta raza: por confirmar en la lista oficial de la DGADR y en eAmbrosia.'
    status: en investigación
- id: onde
  title: Dónde encontrar
  summary: Dónde encontrar.
  blocks:
