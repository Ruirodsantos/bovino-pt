intro: Uno de los bovinos más pequeños del mundo, en la sierra de Peneda-Gerês.
facts:
- label: Cuna
  value: Parque Nacional da Peneda-Gerês
- label: Efectivo
  value: 6 126
  note: '2019'
sections:
- id: historia
  title: Historia
  summary: Origen y trayectoria de la raza, según el catálogo oficial.
  blocks:
  - title: La historia
    paras:
    - 'La Cachena vivió durante siglos aislada en la alta montaña, en efectivos pequeños, y solo recibió un nombre en la literatura oficial en 1981, en una monografía sobre los bovinos portugueses. Habría evolucionado a partir de los mismos animales que dieron origen a la Barrosã, pero seleccionados por el frío y la escasez: solo sobrevivían los más rústicos, capaces de pasar inviernos duros en la sierra sin ayuda humana. El registro zootécnico comenzó en 1994 y el libro genealógico, que la reconoció como raza autóctona, en 1998. En 2010 el efectivo apenas superaba las 2500 hembras y los 140 machos.'
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 26
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Hoy
    paras:
    - El catálogo la considera en riesgo de extinción. Los animales están repartidos por 10 distritos y 26 municipios, con predominio de Viana do Castelo (Arcos de Valdevez es el centro), pero también con un efectivo numeroso en el Sur (Beja y Évora).
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 26
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Estado del texto
    paras:
    - Texto original del proyecto, reescrito a partir del Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 26. Ningún párrafo es copia del catálogo. Los hechos se han contrastado con el catálogo; la revisión independiente (ChatGPT/especialista) está pendiente. Todas las cifras y estados de conservación son los del catálogo de 2019, no efectivos actuales; faltan por localizar datos oficiales más recientes.
- id: caracteristicas
  title: Características
  summary: Cómo se reconoce al animal.
  blocks:
  - title: Cómo se reconoce
    paras:
    - 'Es pequeña: la alzada a la cruz puede quedar por debajo de 1,10 m. Los cuernos, de sección redonda, crecen hacia arriba y hacia los lados como un tornillo, al contrario que la lira de la Barrosã. La cabeza es larga y de perfil recto. El pelo es castaño claro y en invierno se cubre de una capa gruesa.'
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 26
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territorio
  summary: La cuna de la raza y el efectivo registrado.
  blocks:
  - title: Cuna
    paras:
    - Parque Nacional da Peneda-Gerês (Arcos de Valdevez).
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 26
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Efectivo registrado (2019)
    paras:
    - 5 869 hembras, 257 machos y 662 criadores, según el catálogo oficial (2019). No son efectivos actuales.
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 26
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Cría
  summary: Cómo y dónde se cría.
  blocks:
  - title: Cómo se cría
    paras:
    - Es una raza de alta montaña, de temperamento bravío y con fuerte instinto maternal. Su cuna está en el Parque Nacional da Peneda-Gerês, entre Castro Laboreiro y la sierra de la Mourela.
    sources:
    - label: Catálogo Oficial de Raças Autóctones Portuguesas (DGAV/CAP, 2019), p. 26
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: carne
  title: Carne
  summary: La carne de esta raza.
  blocks:
  - title: La carne
    paras:
    - La descripción de la carne de esta raza (color, grasa, maduración, cortes) aún no se ha confirmado en una fuente. No la publicamos hasta que haya una referencia.
    status: en investigación
- id: certificacao
  title: Certificación
  summary: Certificación y reconocimientos.
  blocks:
  - title: Certificación
    paras:
    - 'Estado de DOP/IGP y otros reconocimientos de esta raza: pendiente de confirmar en la lista oficial de la DGADR y en eAmbrosia.'
    status: en investigación
- id: onde
  title: Dónde encontrar
  summary: Dónde encontrar.
  blocks:
