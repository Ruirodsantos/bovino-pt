intro: La raza de Miranda do Douro y de la posta mirandesa.
facts:
- label: Solar
  value: Terras de Miranda
- label: Efectivo
  value: 4 797
  note: '2019'
sections:
- id: historia
  title: Historia
  summary: Origen y trayectoria de la raza, según el catálogo oficial.
  blocks:
  - title: La historia
    paras:
    - 'El nombre viene de Miranda do Douro y de las Terras de Miranda, el centro desde donde la raza se extendió. Su origen remoto se discute: hay quien la hace descender del bovino salvaje, quien la vincula a un tronco centroeuropeo de cabeza cóncava, y quien habla de una mezcla. En los siglos XIX y XX se distinguieron tres tipos: la Mirandesa propiamente dicha (municipios de Miranda do Douro, Mogadouro y Vimioso), la Bragancesa, más oscura y lechera (Bragança y Vinhais), y la Beiroa, más clara (Beiras). Hoy ya ni siquiera se ve el pelaje más oscuro de la Bragancesa. A partir de la década de 1970, la mecanización y las razas exóticas hicieron retroceder a la Mirandesa, hasta quedar, a comienzos de los años 90, casi solo en su solar. Después, el efectivo fue disminuyendo en el solar y creciendo fuera de él, sobre todo en el Alentejo y en las Beiras.'
    sources:
    - label: Catálogo Oficial de Razas Autóctonas Portuguesas (DGAV/CAP, 2019), p. 54
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Estado del texto
    paras:
    - Texto original del proyecto, reescrito a partir del Catálogo Oficial de Razas Autóctonas Portuguesas (DGAV/CAP, 2019), p. 54. Ningún párrafo es copia del catálogo. Los hechos se contrastaron con el catálogo; la revisión independiente (ChatGPT/especialista) está pendiente. Todas las cifras y estados de conservación son los del catálogo de 2019, no efectivos actuales; datos oficiales más recientes por buscar.
- id: caracteristicas
  title: Características
  summary: Cómo se reconoce al animal.
  blocks:
  - title: Cómo se reconoce
    paras:
    - 'Es un animal grande: las vacas pesan unos 500 kg y los toros 900 kg. El pelaje es rubio en el dorso y en la marrafa y se oscurece hasta el negro en las extremidades. Los machos son más oscuros; las crías, uniformemente rubias. Los cuernos son blanquecinos, oscurecidos en la punta.'
    sources:
    - label: Catálogo Oficial de Razas Autóctonas Portuguesas (DGAV/CAP, 2019), p. 54
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territorio
  summary: El solar de la raza y el efectivo registrado.
  blocks:
  - title: Solar
    paras:
    - Terras de Miranda (Miranda do Douro, Mogadouro, Vimioso).
    sources:
    - label: Catálogo Oficial de Razas Autóctonas Portuguesas (DGAV/CAP, 2019), p. 54
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Efectivo registrado (2019)
    paras:
    - 4 492 hembras, 305 machos y 344 criadores, según el catálogo oficial (2019). No son efectivos actuales.
    sources:
    - label: Catálogo Oficial de Razas Autóctonas Portuguesas (DGAV/CAP, 2019), p. 54
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Cría
  summary: Cómo y dónde se cría.
  blocks:
  - title: Cómo se cría
    paras:
    - 'Coexisten dos sistemas: la semiestabulación tradicional y el sistema extensivo, que es el único fuera del solar y está creciendo dentro de él. En el extensivo, los terneros andan con las madres en pastoreo hasta los 5 a 7 meses; después se destetan y se ceban con henos y cereales de la propia explotación. El catálogo menciona la Denominación de Origen Protegida «Carne Mirandesa», que se confirmará en eAmbrosia.'
    sources:
    - label: Catálogo Oficial de Razas Autóctonas Portuguesas (DGAV/CAP, 2019), p. 54
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: carne
  title: Carne
  summary: La carne de esta raza.
  blocks:
  - title: La carne
    paras:
    - La descripción de la carne de esta raza (color, grasa, maduración, cortes) aún no se ha confirmado en fuente. No la publicamos hasta que haya referencia.
    status: en investigación
- id: certificacao
  title: Certificación
  summary: Certificación y reconocimientos.
  blocks:
  - title: Certificación
    paras:
    - 'Estado de DOP/IGP y otros reconocimientos de esta raza: por confirmar en la lista oficial de la DGADR y en eAmbrosia.'
    status: en investigación
- id: onde
  title: Dónde encontrar
  summary: Dónde encontrar.
  blocks:
  - title: Dónde encontrar
    paras:
    - 'Puntos de venta, productores y asociación de criadores: por investigar. No indicamos puntos de venta ni precios que no hayamos verificado.'
    status: en investigación
