intro: The breed that was once declared extinct and has been recovered.
facts:
- label: Homeland
  value: Algarve
- label: Herd
  value: '4'
  note: '2019'
sections:
- id: historia
  title: History
  summary: Origin and path of the breed, according to the official catalogue.
  blocks:
  - title: The history
    paras:
    - 'The Algarvia is a rare case: in 2004, the national report on animal genetic resources classed it as one of the breeds that became extinct in Portugal in the twentieth century. The reason lay in breeders'' practice: crossing the cows with breeds such as the Limousine and the Charolais to obtain fast-growing calves, the so-called «chamuscos». Over the generations, the pure animals gradually disappeared.'
    - In 2005 a recovery project began. It found 43 females and 4 males, with enough variability to represent a population genetically distinct from the other native breeds of the south.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 10
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Today
    paras:
    - In 2019 the adult herd book had only 2 males and 2 females of pure line, held by 3 breeders. This is the smallest herd of all the registered native cattle breeds, and it justifies the classification of the breed as critically endangered.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 10
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Status of the text
    paras:
    - Original projeto text, rewritten from the Official Catalogue of Portuguese Native Breeds (Catálogo Oficial de Raças Autóctones Portuguesas, DGAV/CAP, 2019), p. 10. No paragraph is copied from the catalogue. The facts have been checked against the catalogue; independent review (ChatGPT/specialist) is pending. All figures and conservation statuses are those of the 2019 catalogue, not current herd numbers; more recent official data is still to be found.
- id: caracteristicas
  title: Characteristics
  summary: How to recognise the animal.
  blocks:
  - title: How to recognise it
    paras:
    - A uniform red or brown coat, with short hair. The head is large and pyramidal in shape; the horns are little developed and grow backwards and outwards in a spiral. The limbs are short and strong.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 10
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territory
  summary: The breed’s homeland and registered herd.
  blocks:
  - title: Homeland
    paras:
    - Algarve — from Aljezur and Monchique to the Barrocal and Castro Marim.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 10
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Registered herd (2019)
    paras:
    - 2 females, 2 males and 3 breeders, according to the official catalogue (2019). Not current herd numbers.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 10
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Rearing
  summary: How and where it is raised.
  blocks:
  - title: How it is raised
    paras:
    - The traditional homeland runs from Aljezur and the Monchique plateau, through the Barrocal, to the municipality of Castro Marim and the right bank of the Guadiana. It is a hardy breed, raised by continuous grazing on spontaneous vegetation and adapted to poor soils.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 10
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: carne
