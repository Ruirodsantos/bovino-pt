intro: One of the smallest cattle in the world, in the Peneda-Gerês mountains.
facts:
- label: Homeland
  value: Peneda-Gerês National Park
- label: Herd
  value: 6 126
  note: '2019'
sections:
- id: historia
  title: History
  summary: Origin and path of the breed, according to the official catalogue.
  blocks:
  - title: The history
    paras:
    - 'The Cachena lived for centuries isolated in the high mountains, in small herds, and only acquired a name in the official literature in 1981, in a monograph on Portuguese cattle. It is thought to have evolved from the same animals that gave rise to the Barrosã, but selected by cold and scarcity: only the hardiest survived, able to endure harsh winters in the mountains without human help. Zootechnical registration began in 1994, and the herd book, which recognised it as a native breed, in 1998. In 2010 the herd barely exceeded 2,500 females and 140 males.'
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 26
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Today
    paras:
    - The catalogue considers it at risk of extinction. The animals are spread over 10 districts and 26 municipalities, predominantly in Viana do Castelo (Arcos de Valdevez is the centre), but also with a sizeable herd in the South (Beja and Évora).
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 26
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Status of the text
    paras:
    - Original projeto text, rewritten from the Official Catalogue of Portuguese Native Breeds (Catálogo Oficial de Raças Autóctones Portuguesas, DGAV/CAP, 2019), p. 26. No paragraph is copied from the catalogue. The facts have been checked against the catalogue; independent review (ChatGPT/specialist) is pending. All figures and conservation statuses are those of the 2019 catalogue, not current herd numbers; more recent official data is still to be found.
- id: caracteristicas
  title: Characteristics
  summary: How to recognise the animal.
  blocks:
  - title: How to recognise it
    paras:
    - 'It is small: the height at the withers can be below 1.10 m. The round-sectioned horns grow upwards and outwards like a corkscrew, unlike the lyre of the Barrosã. The head is long with a straight profile. The coat is light brown, and in winter it is covered in a thick fleece.'
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 26
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territory
  summary: The breed’s homeland and registered herd.
  blocks:
  - title: Homeland
    paras:
    - Peneda-Gerês National Park (Arcos de Valdevez).
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 26
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Registered herd (2019)
    paras:
    - 5 869 females, 257 males and 662 breeders, according to the official catalogue (2019). Not current herd numbers.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 26
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Rearing
  summary: How and where it is raised.
  blocks:
  - title: How it is raised
    paras:
    - It is a high-mountain breed, with a wild temperament and a strong maternal instinct. Its homeland lies in the Peneda-Gerês National Park, between Castro Laboreiro and the Serra da Mourela.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 26
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
