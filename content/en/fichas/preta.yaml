intro: The «charnequeiro» cattle south of the Tejo, now raised for meat.
facts:
- label: Homeland
  value: South of the Tagus
- label: Herd
  value: 1 844
  note: '2019'
sections:
- id: historia
  title: History
  summary: Origin and path of the breed, according to the official catalogue.
  blocks:
  - title: The history
    paras:
    - From the middle of the nineteenth century there are records of black cattle under names such as «Gado Charnequeiro do Sul do Tejo» (heathland cattle of the south of the Tejo) and «Gado da Terra» (local cattle). They were mainly draught animals, valued for their strength and for tolerating poor feed and extreme climate, and for their dung, which fertilised the land; meat counted for little. With agricultural modernisation they lost their function, and in the 1980s the arrival of exotic breeds reduced the herd further, to the point that the breed was considered close to extinction. It survived thanks to breeders who kept nuclei of pure females to produce crossbreds.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 58
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Status of the text
    paras:
    - Original projeto text, rewritten from the Official Catalogue of Portuguese Native Breeds (Catálogo Oficial de Raças Autóctones Portuguesas, DGAV/CAP, 2019), p. 58. No paragraph is copied from the catalogue. The facts have been checked against the catalogue; independent review (ChatGPT/specialist) is pending. All figures and conservation statuses are those of the 2019 catalogue, not current herd numbers; more recent official data is still to be found.
- id: caracteristicas
  title: Characteristics
  summary: How to recognise the animal.
  blocks:
  - title: How to recognise it
    paras:
    - 'A coat tending towards uniform black, sometimes brown or brindled. It is an animal of large build: cows of 400 to 600 kg and bulls of 700 to 1,000 kg. The horns are in a high hook. Males have a large crest.'
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 58
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territory
  summary: The breed’s homeland and registered herd.
  blocks:
  - title: Homeland
    paras:
    - South of the Tagus — the former «Gado Charnequeiro do Sul do Tejo» (heathland cattle of the south Tagus).
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 58
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Registered herd (2019)
    paras:
    - 1 774 females, 70 males and 30 breeders, according to the official catalogue (2019). Not current herd numbers.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 58
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Rearing
  summary: How and where it is raised.
  blocks:
  - title: How it is raised
    paras:
    - Today the aim is almost solely meat, in an extensive system. It feeds on natural pastures, generally under the cover of the montado (cork-oak and holm-oak woodland), on stubble, acorns and thinnings from the montado. Breeders cite adaptation to disadvantaged areas as the main advantage.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 58
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
