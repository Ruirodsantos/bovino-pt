intro: The breed with great lyre-shaped horns, from the Barroso plateau.
facts:
- label: Homeland
  value: Upland areas of the Barroso
- label: Herd
  value: 7 130
  note: '2019'
sections:
- id: historia
  title: History
  summary: Origin and path of the breed, according to the official catalogue.
  blocks:
  - title: The history
    paras:
    - The origin of the Barrosã is much debated. One of the hypotheses the catalogue mentions links it to North African cattle with large, thick horns, which would have reached the Iberian Peninsula during the Moorish presence. It would later have been pushed by other groups of cattle into the highlands of Barroso, where it stayed. Whatever its origin, it is a breed of very distinctive morphology, hard to fit among the other Iberian breeds.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 18
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Today
    paras:
    - The catalogue states that the Barrosã is increasingly raised for meat, and mentions the Protected Designation of Origin (PDO) «Carne Barrosã». The exact registration of the designation will be confirmed in the European eAmbrosia database before it is shown as verified data.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 18
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Status of the text
    paras:
    - Original projeto text, rewritten from the Official Catalogue of Portuguese Native Breeds (Catálogo Oficial de Raças Autóctones Portuguesas, DGAV/CAP, 2019), p. 18. No paragraph is copied from the catalogue. The facts have been checked against the catalogue; independent review (ChatGPT/specialist) is pending. All figures and conservation statuses are those of the 2019 catalogue, not current herd numbers; more recent official data is still to be found.
- id: caracteristicas
  title: Characteristics
  summary: How to recognise the animal.
  blocks:
  - title: How to recognise it
    paras:
    - The thick, long horns, in a high lyre, are what one sees first. The coat is light brown, between straw and cherry-red, and the skin is thick but soft, with folds on the neck. The dewlap is very well developed. It is a docile breed with a strong maternal instinct.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 18
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territory
  summary: The breed’s homeland and registered herd.
  blocks:
  - title: Homeland
    paras:
    - Upland areas of the Barroso.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 18
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Registered herd (2019)
    paras:
    - 6 775 females, 355 males and 1 926 breeders, according to the official catalogue (2019). Not current herd numbers.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 18
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Rearing
  summary: How and where it is raised.
  blocks:
  - title: How it is raised
    paras:
    - 'It is raised in an extensive system, in the mountains and on mid-slopes, making use of resources such as carqueja and gorse. The catalogue stresses its role in the rural landscape: it worked small plots and terraces, and supplied manure for poor soils.'
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 18
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: carne
