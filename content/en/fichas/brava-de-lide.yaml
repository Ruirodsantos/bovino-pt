intro: The only breed selected for behaviour.
facts:
- label: Homeland
  value: Ribatejo and Oeste
- label: Herd
  value: 6 413
  note: '2019'
sections:
- id: historia
  title: History
  summary: Origin and path of the breed, according to the official catalogue.
  blocks:
  - title: The history
    paras:
    - 'The Brava de Lide is unlike every other native breed: it was selected not for its body but for its character. The catalogue associates its origin with the aurochs (uro), the wild cattle that survived in Europe until the seventeenth century; this is a thesis about origin, not a direct lineage demonstrated in this text. In Portugal, the most aggressive animals that turned up among local cattle eventually gave rise to a line of their own, cultivated for courage, and the bullfight (lide) became the breed''s reason for being.'
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 22
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Today
    paras:
    - The breeding regions are the Alentejo, the Ribatejo and Oeste, the Beira Interior and the Beira Litoral, and the Azores. This breed has a cultural and ecological function of its own; the projeto does not deal with its meat.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 22
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Status of the text
    paras:
    - Original projeto text, rewritten from the Official Catalogue of Portuguese Native Breeds (Catálogo Oficial de Raças Autóctones Portuguesas, DGAV/CAP, 2019), p. 22. No paragraph is copied from the catalogue. The facts have been checked against the catalogue; independent review (ChatGPT/specialist) is pending. All figures and conservation statuses are those of the 2019 catalogue, not current herd numbers; more recent official data is still to be found.
- id: caracteristicas
  title: Characteristics
  summary: How to recognise the animal.
  blocks:
  - title: How to recognise it
    paras:
    - It has a fine skeleton, thin skin, a well-muscled trunk, little dewlap and fine, hook-shaped horns. The coat colours are highly varied and are part of the vocabulary of the breeding trade. The average weights given in the catalogue are about 500 kg for males and 280 kg for females.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 22
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territory
  summary: The breed’s homeland and registered herd.
  blocks:
  - title: Homeland
    paras:
    - Ribatejo and Oeste, Alentejo, Beiras and the Azores.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 22
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Registered herd (2019)
    paras:
    - 5 938 females, 475 males and 97 breeders, according to the official catalogue (2019). Not current herd numbers.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 22
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Rearing
  summary: How and where it is raised.
  blocks:
  - title: How it is raised
    paras:
    - It lives on large estates, in plains and valleys with water and pasture. Breeding is done by bloodlines, the «encastes», and selection is based on behavioural trials.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 22
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: carne
