intro: The breed thought to be extinct, which the breeders of Guarda brought back.
facts:
- label: Homeland
  value: The former municipality of Jarmelo
- label: Herd
  value: '218'
  note: '2019'
sections:
- id: historia
  title: History
  summary: Origin and path of the breed, according to the official catalogue.
  blocks:
  - title: The history
    paras:
    - In 1870, the livestock census described the Jarmelista breed, concentrated in the former municipality of Jarmelo (now part of Guarda), as the best in the district, perhaps in the country. Then, over about fifty years, it declined so sharply that in 1954 one author gave it up as extinct. What saved it was the persistence of the people of the region and of the breeders' association (Acriguarda), who identified the animals with the characteristics of the breed. In 2006, a study of 185 morphological traits in females and 170 in males showed that they form a distinct group, independent of all the other native breeds.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 34
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Today
    paras:
    - The herd book records 25 males and 193 females among 25 breeders (2019).
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 34
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Status of the text
    paras:
    - Original projeto text, rewritten from the Official Catalogue of Portuguese Native Breeds (Catálogo Oficial de Raças Autóctones Portuguesas, DGAV/CAP, 2019), p. 34. No paragraph is copied from the catalogue. The facts have been checked against the catalogue; independent review (ChatGPT/specialist) is pending. All figures and conservation statuses are those of the 2019 catalogue, not current herd numbers; more recent official data is still to be found.
- id: caracteristicas
  title: Characteristics
  summary: How to recognise the animal.
  blocks:
  - title: How to recognise it
    paras:
    - It is a long-bodied bovine, of large stature and fine skeleton, with a pale yellow coat and darker extremities. Males are usually darker. The horns are medium-sized, pale and dark-tipped. The legs are tall.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 34
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territory
  summary: The breed’s homeland and registered herd.
  blocks:
  - title: Homeland
    paras:
    - The former municipality of Jarmelo, now Guarda.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 34
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Registered herd (2019)
    paras:
    - 193 females, 25 males and 25 breeders, according to the official catalogue (2019). Not current herd numbers.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 34
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Rearing
  summary: How and where it is raised.
  blocks:
  - title: How it is raised
    paras:
    - In an extensive system, in the mountains, with high-altitude pastures, wide temperature swings and many small farms with few animals. It is very hardy and docile, and withstands better than other breeds raised in the same system, according to the catalogue.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 34
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
