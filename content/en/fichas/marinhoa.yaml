intro: A farm-working breed from the Vouga estuary.
facts:
- label: Homeland
  value: Lands of the Vouga
- label: Herd
  value: '975'
  note: '2019'
sections:
- id: historia
  title: History
  summary: Origin and path of the breed, according to the official catalogue.
  blocks:
  - title: The history
    paras:
    - The Marinhoa is tied to the «marinhas» of the Beira Litoral, the low, fertile lands of the estuary of the Vouga, the Cértima and the Antuã. It was a powerful, long-legged animal, ideal for rice growing, for gathering moliço (seaweed) in the lagoon and for the Arte Xávega (beach seine fishing). It was present in almost every household, and helped to keep people in the villages of a region of small plots. Mechanisation reduced the animals' work, and the dairy basin that developed in the region replaced many Marinhoas with dairy cows. It survived because many families kept a few animals as an economic supplement.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 38
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Today
    paras:
    - The meat aptitude is the one mainly exploited; work is residual.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 38
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Status of the text
    paras:
    - Original projeto text, rewritten from the Official Catalogue of Portuguese Native Breeds (Catálogo Oficial de Raças Autóctones Portuguesas, DGAV/CAP, 2019), p. 38. No paragraph is copied from the catalogue. The facts have been checked against the catalogue; independent review (ChatGPT/specialist) is pending. All figures and conservation statuses are those of the 2019 catalogue, not current herd numbers; more recent official data is still to be found.
- id: caracteristicas
  title: Characteristics
  summary: How to recognise the animal.
  blocks:
  - title: How to recognise it
    paras:
    - 'It is a large animal: about 135 cm tall at the withers, and 600 to 700 kg in adult females, 900 to 1,000 kg in males. The coat is yellow, in straw shades, sometimes more cherry-red, with darker hairs on the edge of the ears, on the dewlap, around the eyes and at the tip of the tail. It is docile and easy to handle.'
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 38
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: territorio
  title: Territory
  summary: The breed’s homeland and registered herd.
  blocks:
  - title: Homeland
    paras:
    - Lands of the Vouga, Cértima and Antuã estuary (Baixo Vouga).
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 38
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
  - title: Registered herd (2019)
    paras:
    - 884 females, 91 males and 280 breeders, according to the official catalogue (2019). Not current herd numbers.
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 38
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: criacao
  title: Rearing
  summary: How and where it is raised.
  blocks:
  - title: How it is raised
    paras:
    - 'The most traditional system is intensive outdoor rearing: grazing for some months of the year and a daily return to the byre. Feeding is based on natural or sown pastures, supplemented with cereals, straw and legumes.'
    sources:
    - label: Official Catalogue of Portuguese Native Breeds (DGAV/CAP, 2019), p. 38
      url: https://www.dgav.pt/wp-content/uploads/2021/04/Catalogo-Oficial-Racas-Autoctones-Portuguesas.pdf
- id: carne
