# Dataset definitions. Each dataset = one API query + selectors that pick the series we publish.
# Selectors match category CODES or LABELS (case-insensitive substring with "~" prefix).
# The collector saves the full response + a catalogue of available categories, so a wrong
# selector produces "no rows" (RED, visible in the run log) — never a silently wrong number.

defaults:
  since: "2005"

datasets:
  - id: bovine_population
    title_pt: Efetivo bovino (inquérito de novembro–dezembro)
    source_id: S02
    api: eurostat
    code: apro_mt_lscatl
    params: {geo: [PT, ES], unit: THS_HD}
    select:
      animals: ["A2000"]
      month: ["M11_M12", "M12"]
    flow: stock
    unit: head
    multiplier: 1000
    period_type: year
    max_change: 0.15        # >15 % year-on-year → YELLOW (review)

  - id: bovine_slaughter_heads_monthly
    title_pt: Bovinos abatidos em matadouros (cabeças, mensal)
    source_id: S02
    api: eurostat
    code: apro_mt_pheadm
    params: {geo: [PT, ES], meat: B1000, unit: THS_HD}
    select:
      meatitem: ["SLAUGHT"]
    flow: slaughter
    unit: head
    multiplier: 1000
    period_type: month
    max_change: 0.6
    # Note: this dataset has no live-animal export/import values for PT/ES (checked 2026-10-17);
    # live trade comes from Comext (trade_live_bovine_pt_es).

  - id: bovine_slaughter_tonnes
    title_pt: Abates de bovinos (toneladas de carcaça)
    source_id: S02
    api: eurostat
    code: apro_mt_pann
    params: {geo: [PT, ES], meat: B1000, unit: THS_T}
    select:
      meatitem: ["SLAUGHT"]
    flow: slaughter
    unit: tonne
    multiplier: 1000
    period_type: year
    max_change: 0.25

  - id: bovine_population_regions
    title_pt: Efetivo bovino por região (NUTS 2)
    source_id: S02
    api: eurostat
    code: [agr_r_animal, ef_lsk_main, ef_lsk_bovine]   # tried in order (agr_r_animal no longer disseminated)
    # Explicit NUTS 2 list (2021 + 2024 PT codes): geoLevel=nuts2 for all EU made ef_lsk_* exceed the
    # 5 000 000-row API limit (HTTP 413 EXTRACTION_TOO_BIG, run 2026-10-18).
    params:
      geo: [PT11, PT15, PT16, PT17, PT18, PT19, PT1A, PT1B, PT1C, PT1D, PT20, PT30,
            ES11, ES12, ES13, ES21, ES22, ES23, ES24, ES30, ES41, ES42, ES43, ES51, ES52, ES53,
            ES61, ES62, ES63, ES64, ES70]
    since: "2010"
    geo_prefix: [PT, ES]
    select:
      animals: ["A2000", "~live bovine animals", "~bovine animals"]
    flow: stock
    unit: head
    multiplier: 1000
    period_type: year
    max_change: 0.30

  - id: trade_live_bovine_pt_es
    title_pt: Bovinos vivos de Portugal para Espanha
    source_id: S03
    api: comext
    code: [DS-045409, DS-059341]     # tried in order; the one that answers is recorded
    params: {reporter: PT, partner: ES, product: ["0102", "01022910", "01022921", "01022929", "01022941", "01022949", "01022951", "01022959", "01022961", "01022969", "01022991", "01022999", "01022110", "01022130", "01022190", "01029020", "01022905", "01023100", "01023910", "01023990", "01029091", "01029099"], flow: "2", freq: M}
    select:
      indicators: ["SUPPLEMENTARY_QUANTITY", "VALUE_IN_EUROS", "QUANTITY_IN_100KG"]
    flow: export
    unit_by_indicator: {SUPPLEMENTARY_QUANTITY: head, VALUE_IN_EUROS: eur, QUANTITY_IN_100KG: kg}
    multiplier_by_indicator: {SUPPLEMENTARY_QUANTITY: 1, VALUE_IN_EUROS: 1, QUANTITY_IN_100KG: 100}
    period_type: month
    max_change: 3.0
    jump_check_codes: ["0102"]
    jump_min_abs: {eur: 1000000, kg: 500000}
    sum_check: {total: "0102", mode: report}   # sub-codes do not fully add up (unlisted/confidential codes) → report coverage, show residual

  - id: trade_beef_pt_es
    title_pt: Comércio de carne de bovino Portugal ↔ Espanha
    source_id: S03
    api: comext
    code: [DS-045409, DS-059341]
    params: {reporter: PT, partner: ES, product: ["0201", "0202"], flow: ["1", "2"], freq: M}
    select:
      indicators: ["VALUE_IN_EUROS", "QUANTITY_IN_100KG"]
    flow_by_code: {"1": import, "2": export}
    unit_by_indicator: {VALUE_IN_EUROS: eur, QUANTITY_IN_100KG: kg}
    multiplier_by_indicator: {VALUE_IN_EUROS: 1, QUANTITY_IN_100KG: 100}
    period_type: month
    max_change: 3.0
    jump_check_codes: ["0201", "0202"]
    jump_min_abs: {eur: 1000000, kg: 500000}
