    value: "Essencialmente o Alentejo — distritos de Portalegre, Évora, Beja e alguns concelhos do distrito de Setúbal. Há também explorações nos distritos de Santarém, Castelo Branco, Guarda e Braga, mas com poucos criadores (catálogo DGAV/CAP, p. 7)."
