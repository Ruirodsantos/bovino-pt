name: Buscar imagens e documentos

# Downloads what is listed in assets/images.yaml (photos, resized to WebP, with credits)
# and research/fetch.yaml (PDF/HTML documents, text extracted) — used because agent
# sandboxes cannot reach most websites. Never overwrites an existing file.
on:
  push:
    branches: [main]
    paths: ["assets/images.yaml", "assets/candidates.yaml", "research/fetch.yaml", "pipeline/fetch_assets.py", "pipeline/image_candidates.py", "pipeline/commons_candidates.py", "pipeline/commons_categories.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: fetch, cancel-in-progress: false }

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: pip install requests pyyaml pillow pdfplumber beautifulsoup4
      - run: python pipeline/commons_candidates.py
        timeout-minutes: 8
        continue-on-error: true
      - run: python pipeline/commons_categories.py
        timeout-minutes: 12
        continue-on-error: true
      - run: python pipeline/fetch_assets.py
      - run: python pipeline/image_candidates.py
        timeout-minutes: 6
        continue-on-error: true
      - run: |
          git config user.name "bovino-pt bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "recursos: imagens e documentos $(date -u +%F)" && git pull --rebase && git push)
